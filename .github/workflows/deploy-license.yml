name: Deploy License Backend

# Automates what scripts/deploy-license.sh (see DEV_GUIDE.md §2.7) previously
# only ran by hand — the Ticket 42 trial-duration fix's own rollout was
# blocked on exactly that manual step. Authenticates to AWS with short-lived
# OIDC credentials; no long-lived access keys are stored in GitHub.
#
# Three jobs, each with strictly less privilege than the one after it:
#
#   test   no AWS credentials at all — runs handler.py's unit suite. A red
#          test here stops the run before anything reaches AWS.
#   plan   assumes AWS_PLAN_ROLE_ARN, whose IAM policy has no
#          cloudformation:ExecuteChangeSet, no DeleteStack and no DynamoDB
#          data-plane access. Runs scripts/deploy-license.sh with
#          PLAN_ONLY=true, which creates and prints a CloudFormation
#          change-set without executing it. This job cannot change
#          production even if it is compromised.
#   apply  gated on the `production` GitHub Environment. Assumes
#          AWS_DEPLOY_ROLE_ARN and actually executes the deployment. Add
#          required reviewers to that environment and this is where a human
#          reads the change-set `plan` printed and decides.
#
# The split is the point: the destructive credential is only ever handed to
# a job that a human released, and what that human approves was printed, in
# full, by a job that could not have applied it.
#
# One-time AWS + GitHub setup is required before this can succeed — see
# serverless/verify-license/CI_DEPLOY_SETUP.md. In short, this needs:
#   - Two IAM OIDC roles in AWS account 641628981129
#     (scripts/deploy-license.sh's EXPECTED_ACCOUNT guard still applies here
#     — both roles must live in that account), with the trust policies and
#     permission policies that document spells out.
#   - Two GitHub Environments, `license-plan` and `production`, each holding
#     the secrets its job needs as **environment** secrets:
#       AWS_PLAN_ROLE_ARN       (license-plan) required
#       AWS_DEPLOY_ROLE_ARN     (production)   required
#       LICENSE_SIGNING_SECRET  (both)         required — scripts/deploy-license.sh
#                               refuses to run without it, and the template's
#                               LicenseSigningSecret parameter is NoEcho, so a
#                               plan can't read the deployed value back and
#                               must pass the real one to produce a change-set
#                               that isn't pure noise
#       STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET, LEMON_API_KEY,
#       SES_SENDER_EMAIL       (both) optional — leave unset to omit that
#                               parameter override entirely (not "set to
#                               empty"), which scripts/deploy-license.sh
#                               handles correctly
#     Environment secrets rather than repository secrets so that a new or
#     modified workflow elsewhere in this repo cannot read them: only a job
#     naming that environment can, and `production` additionally requires a
#     reviewer to release the run.
#
# Until those are configured, this workflow runs and fails at its "Check
# required secrets are configured" step, naming the secrets that are
# missing, rather than silently doing nothing — deliberate, so incomplete
# setup shows up as a red X in the Actions tab instead of a deploy nobody
# notices never happened.
#
# ── About `environment:` and the OIDC `sub` claim — READ BEFORE EDITING ─────
# Naming a GitHub Environment on a job changes the OIDC `sub` claim GitHub
# issues from `repo:OWNER/REPO:ref:refs/heads/BRANCH` to
# `repo:OWNER/REPO:environment:ENV_NAME` — *even with zero protection rules
# configured on that environment*. This workflow originally shipped with
# `environment: production` as a "no-op until you add reviewers"
# convenience and it broke every OIDC role-assumption attempt until it was
# removed. Both jobs below now name an environment deliberately, so both
# trust policies must be written for the `environment:` form (they are, in
# CI_DEPLOY_SETUP.md). If you rename an environment here, update that
# role's trust policy in the same change — and land the IAM edit *first*,
# or the next run fails at assume-role.

on:
  push:
    branches: [main]
    paths:
      - 'serverless/verify-license/**'
      - 'scripts/deploy-license.sh'
      - '.github/workflows/deploy-license.yml'
  # Manual re-deploy from the Actions tab (or `gh workflow run
  # deploy-license.yml`). The push trigger above only fires when the
  # backend's own files change, so there was otherwise no way to re-run a
  # deploy after rotating a secret, recovering a rolled-back stack, or
  # landing a client-only change that still needs the current stack
  # re-applied. This widens who can *start* a run, not what a run can do:
  # the `production` reviewers still gate the only job that can change
  # anything, and both trust policies pin the branch (see CI_DEPLOY_SETUP.md),
  # so a dispatch from a non-main ref fails at assume-role.
  workflow_dispatch:

# A second push landing mid-deploy queues behind the first rather than
# cancelling it — an interrupted `sam deploy` can leave the CloudFormation
# stack in UPDATE_ROLLBACK_FAILED, which needs manual intervention to clear.
# Note this now also holds the queue while `apply` waits for its reviewer.
concurrency:
  group: deploy-license
  cancel-in-progress: false

# Workflow-level default. `test` narrows it further; the two AWS jobs need
# id-token: write for aws-actions/configure-aws-credentials's OIDC flow.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests (pre-deploy gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No id-token here: this job never talks to AWS, so it is not given the
    # ability to request an OIDC token at all.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails the run before anything touches AWS if the trial-duration cap
      # logic (or anything else handler.py's suite covers) is broken —
      # see serverless/verify-license/test_handler.py. Discovery rather than
      # a named module, so a suite added next to it runs without this step
      # having to be remembered — test_generate_test_license.py is the first
      # to arrive that way.
      - name: Run handler.py unit tests
        working-directory: serverless/verify-license
        run: python3 -m unittest discover -p 'test_*.py' -v

  plan:
    name: Plan (change-set preview, cannot apply)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scopes the plan role ARN and signing secret to this job. Give this
    # environment NO protection rules — it is not an approval gate, it is a
    # secret boundary, and a reviewer requirement here would just mean
    # approving twice.
    environment: license-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # An unset secret interpolates to an empty string, and
      # configure-aws-credentials then silently drops `role-to-assume` from
      # its inputs and falls back to the default provider chain — failing
      # with "Could not load credentials from any providers", which names
      # neither the secret nor this repo's setup doc. Check first so the
      # error says what is actually missing.
      - name: Check required secrets are configured
        env:
          PLAN_ROLE_ARN:          ${{ secrets.AWS_PLAN_ROLE_ARN }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
        run: |
          missing=()
          [[ -n "$PLAN_ROLE_ARN" ]]          || missing+=("AWS_PLAN_ROLE_ARN")
          [[ -n "$LICENSE_SIGNING_SECRET" ]] || missing+=("LICENSE_SIGNING_SECRET")
          if (( ${#missing[@]} )); then
            printf 'Missing environment secret(s) on `license-plan`: %s\n' "${missing[*]}" >&2
            printf 'This is one-time setup, not a code failure — see\n' >&2
            printf 'serverless/verify-license/CI_DEPLOY_SETUP.md sections 2c, 3 and 4.\n' >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # PLAN_ONLY=true: builds, uploads artifacts, creates and prints a
      # change-set, then stops. Skips the destructive stale-stack cleanup the
      # apply job does. Passing a secret through as an empty env var is fine —
      # the script only adds a parameter override when the value is non-empty.
      - name: Plan (sam build + change-set, no execute)
        env:
          PLAN_ONLY: "true"
          AWS_REGION: us-east-1
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LEMON_API_KEY: ${{ secrets.LEMON_API_KEY }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
        run: scripts/deploy-license.sh

  apply:
    name: Apply (requires approval)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The approval gate. Configure required reviewers on this environment in
    # Settings → Environments → production; until someone releases the run,
    # AWS_DEPLOY_ROLE_ARN is never handed out and nothing is applied.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Same guard as `plan` — see the note there. Reached only after a
      # reviewer has released the run, so a missing secret here costs an
      # approval; worth naming precisely rather than failing opaquely.
      - name: Check required secrets are configured
        env:
          DEPLOY_ROLE_ARN:        ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
        run: |
          missing=()
          [[ -n "$DEPLOY_ROLE_ARN" ]]        || missing+=("AWS_DEPLOY_ROLE_ARN")
          [[ -n "$LICENSE_SIGNING_SECRET" ]] || missing+=("LICENSE_SIGNING_SECRET")
          if (( ${#missing[@]} )); then
            printf 'Missing environment secret(s) on `production`: %s\n' "${missing[*]}" >&2
            printf 'This is one-time setup, not a code failure — see\n' >&2
            printf 'serverless/verify-license/CI_DEPLOY_SETUP.md sections 2b, 3 and 4.\n' >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # scripts/deploy-license.sh: verifies the assumed identity's AWS account
      # matches EXPECTED_ACCOUNT, cleans up an unusable
      # REVIEW_IN_PROGRESS/ROLLBACK_COMPLETE/CREATE_FAILED stack, runs
      # `sam build` + `sam deploy`, and prints the stack outputs (including
      # the Function URL) on success. It recomputes its own change-set rather
      # than executing the one `plan` created — same commit, same parameters,
      # so the same diff, and it keeps this job working even if the plan's
      # change-set was pruned while the run waited for approval.
      - name: Deploy (sam build + sam deploy)
        env:
          AWS_REGION: us-east-1
          LICENSE_SIGNING_SECRET: ${{ secrets.LICENSE_SIGNING_SECRET }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          LEMON_API_KEY: ${{ secrets.LEMON_API_KEY }}
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
        run: scripts/deploy-license.sh

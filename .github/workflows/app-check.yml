name: App Sanity Check

# Fast, always-on gate that the Electron/React application itself is
# healthy: types check, the vitest unit suite passes, and the main/preload/
# renderer bundles actually compile. This is deliberately separate from
# ci.yml (which is scoped to engine/** changes and needs heavy Python/ML
# dependencies) — this workflow covers everything ci.yml's path filter
# skips, and runs on every push/PR instead of only engine changes.
#
# It does NOT run electron-builder packaging (that needs platform-specific
# code signing / installer tooling — see build-windows.yml and
# build-macos-dmg.yml for those, both manually triggered) — just the plain
# electron-vite build, which is enough to catch compile-time breakage.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  app-check:
    name: Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main/preload + renderer)
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build main/preload/renderer bundles
        run: npx electron-vite build

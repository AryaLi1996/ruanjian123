name: Build Windows Installer

# Manual trigger only for now — this produces a real ruanjian-engine.exe
# (PyInstaller can't cross-compile, so this has to run on an actual Windows
# machine; a GitHub-hosted windows-latest runner is the stand-in for that)
# and packages the portable .exe installer via electron-builder.
on:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # scripts/package-engine.sh is a bash script; windows-latest runners
      # ship Git for Windows, which provides the bash used here.
      - name: Build the Python engine (PyInstaller)
        shell: bash
        run: bash scripts/package-engine.sh --force

      - name: Build renderer + main
        run: npx electron-vite build

      # The previous two runs produced zero log output for this step (it
      # completed "successfully" in ~2s with nothing printed, no .exe in
      # dist/) despite the exact same `npx <tool>` pattern working fine one
      # step above for electron-vite — genuinely unclear why yet. Switching
      # to bash (matching the PyInstaller step, which is known to work) and
      # forcing electron-builder's DEBUG logging + an explicit post-mortem
      # directory listing, so if it still comes up empty the next run's logs
      # actually explain why instead of just silently reporting success.
      - name: Package Windows portable .exe
        shell: bash
        env:
          DEBUG: electron-builder
        run: |
          npx electron-builder --win portable --x64
          echo "--- dist/ contents after packaging ---"
          find dist -maxdepth 2 2>&1 || echo "(dist/ does not exist)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruanjian-windows-portable
          path: dist/*.exe
          retention-days: 14
          # Default is "warn" — a step whose glob matches nothing still
          # reports success, which is exactly what silently happened on the
          # first run of this workflow (the engine bundle came out broken
          # upstream, electron-builder produced no .exe, and this step
          # cheerfully "succeeded" with an empty artifact). Fail loud instead.
          if-no-files-found: error

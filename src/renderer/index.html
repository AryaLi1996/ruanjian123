<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!--
      Electron loads from file:// in production; 'self' alone sometimes blocks
      type="module" script resolution on Windows. Widen to allow the bundled
      assets while keeping external-origin requests blocked.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruanjian</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

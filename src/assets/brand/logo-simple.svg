<!--
  SootheVoice (舒音) brand mark — "feather + soundwave" (Direction 1).
  Simplified variant: feather outline + soundwave only, no background —
  for the top toolbar and other small/inline UI placements.

  GENERATED FILE — do not hand-edit. Source of truth is
  src/renderer/src/components/brand/brandMark.ts; regenerate with
  node scripts/generate-brand-svg.ts

  This static file uses the default accent (#00E5A0). Anywhere the logo
  needs to track the user's chosen theme colour use the BrandLogo React
  component instead (src/renderer/src/components/brand/BrandLogo.tsx),
  which inlines the same artwork with the soundwave coloured via the
  CSS custom property color-primary.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SootheVoice logo">
  <!-- Feather outline -->
  <path
    d="M256,86 C302,108 334,176 326,246 C320,300 296,344 258,370 C230,348 210,306 208,246 C206,182 222,120 256,86 Z"
    fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4" stroke-linejoin="round" />
  <!-- Quill -->
  <path d="M258,368 C250,388 240,406 230,426" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round" />

  <!-- Central soundwave (equalizer bars along the feather's spine) -->
  <g fill="#00E5A0">
    <rect x="218.5" y="215" width="7" height="26" rx="3.5" />
    <rect x="230.5" y="205" width="7" height="46" rx="3.5" />
    <rect x="242.5" y="194" width="7" height="68" rx="3.5" />
    <rect x="254.5" y="182" width="7" height="92" rx="3.5" />
    <rect x="266.5" y="194" width="7" height="68" rx="3.5" />
    <rect x="278.5" y="205" width="7" height="46" rx="3.5" />
    <rect x="290.5" y="215" width="7" height="26" rx="3.5" />
  </g>

  <!-- Subtle wave lines (sound emanating to the right) -->
  <g fill="none" stroke="#00E5A0" stroke-linecap="round">
    <path d="M340,200 Q380,228 340,256" stroke-width="5" stroke-opacity="0.45" />
    <path d="M352,180 Q404,228 352,276" stroke-width="5" stroke-opacity="0.3" />
    <path d="M364,158 Q430,228 364,298" stroke-width="5" stroke-opacity="0.18" />

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ruanjian subscription license verification API

Parameters:
  LicenseSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret shared with the Electron app license configuration
  PaymentProvider:
    Type: String
    Default: custom
    AllowedValues:
      - custom
      - stripe
      - lemonsqueezy
      - paddle
  StripeApiKey:
    Type: String
    Default: ''
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Stripe webhook signing secret ("whsec_...") from Dashboard → Developers → Webhooks.
      Required to accept POST <FunctionUrl>/stripe-webhook (checkout.session.completed →
      issues a license key onto the new subscription's metadata).
  LemonApiKey:
    Type: String
    Default: ''
    NoEcho: true
  SesSenderEmail:
    Type: String
    Default: ''
    Description: >-
      Verified SES sender address used to email newly-issued license keys after
      checkout. Leave blank to disable email delivery (the key still lands in
      Stripe metadata either way — see _handle_checkout_completed in handler.py).
  MockMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ExpiryDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 366
  TrialDays:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 366
    Description: >-
      Free trial length in days (Ticket 33, revised from 7 to 3 by Ticket 42).
      Existing trial records longer than this are truncated down to
      TrialDays from their original trialStart the next time they're read,
      as long as they haven't already expired — see
      _apply_trial_duration_cap() in handler.py.

  # ── Demo licence ────────────────────────────────────────────────────────────
  DemoDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 366
    Description: >-
      How long a demo licence runs, in days. Unlike TrialDays this is not
      applied retroactively: a demo already issued keeps the window its token
      was signed for, because the token is in the client's hands and
      shortening the stored record would not shorten it.

  DemoPlanId:
    Type: String
    Default: demo
    AllowedPattern: '^[A-Za-z0-9_-]{1,32}$'
    Description: >-
      The planId a demo token carries. Deliberately matches no entry in
      _PLAN_TIERS, so anything reading a licence can tell a demo from a
      purchase.

  DefaultAppId:
    Type: String
    Default: smoothvoice
    AllowedPattern: '^[A-Za-z0-9_.-]{1,64}$'
    Description: >-
      Which app a request that names no appId belongs to. The existing rows
      were stamped with this value, so an older client that sends none still
      resolves to the same records.

  # ── Ticket 34: multi-period plans ───────────────────────────────────────────
  BaseMonthlyPrice:
    Type: String
    Default: '99'
    Description: >-
      Base monthly subscription price (major currency units, e.g. "99" for
      RMB 99/month — Ticket 36). Quarterly/semi-annual/annual plans apply a
      discount on top of this — see _build_plans() in handler.py.
  PlanCurrency:
    Type: String
    Default: cny
    Description: ISO 4217 currency code (lowercase) for the computed plans, e.g. cny or usd.
  UsdExchangeRate:
    Type: String
    Default: '7.0'
    Description: >-
      Ticket 36: fixed CNY→USD rate used only to compute the priceUSD display
      field on GET /plans for the English UI. Actual payment is always
      processed in PlanCurrency.

  # ── Ticket 28: multi-channel payment ────────────────────────────────────────
  PaymentSuccessUrl:
    Type: String
    Default: 'https://ruanjian.app/payment/success'
    Description: >-
      Stripe Checkout success_url base. The app never loads this page (it
      detects success by polling /order-status), but Stripe requires a valid
      HTTPS URL to redirect to after payment.
  PaymentCancelUrl:
    Type: String
    Default: 'https://ruanjian.app/payment/cancel'
  DouyinAppId:
    Type: String
    Default: ''
    Description: Douyin Open Platform app ID. Leave blank to disable Douyin Pay.
  DouyinMerchantId:
    Type: String
    Default: ''
  DouyinAppSecret:
    Type: String
    Default: ''
    NoEcho: true
  DouyinNotifyUrl:
    Type: String
    Default: ''
    Description: Overrides the auto-derived <FunctionUrl>/douyin-webhook callback URL.

  # ── Cloud fill metering ─────────────────────────────────────────────────────
  # The desktop app can hand a watermark's opaque pixels to the inpainting
  # service in serverless/cloud-inpaint, which costs GPU time. fill/quota and
  # fill/consume in handler.py decide whether it may and count what it spent.
  # Every number the app shows comes from here, which is what makes changing
  # the allowance or the price a parameter change rather than a release
  # everybody has to install.
  FillEndpointUrl:
    Type: String
    Default: ''
    Description: >
      The inpaint service's /inpaint URL, handed to the app with each
      permission. scripts/deploy-license.sh reads it out of the
      shuyin-cloud-inpaint stack's outputs, so it is not normally set by hand.
      Empty switches the feature off for everyone on their next export — which
      is what "not deployed yet" looks like, and is the default.

  FillSigningSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: >
      Signs the short-lived tokens the inpaint service checks. The same value
      as that stack's FillSigningSecret parameter, and deliberately NOT
      LicenseSigningSecret: rotating this one costs at most one export's
      fallback to the local filler, because a fill token lives minutes, while
      rotating the licence secret needs a build shipped first. Sharing them
      would drag the cheap rotation onto the expensive one's schedule. Empty
      switches the feature off, the same as an empty endpoint.

  FillFreeUnits:
    Type: Number
    Default: 100
    MinValue: 0
    Description: Exports included per calendar month, per account.

  FillOveragePrice:
    Type: String
    Default: ''
    Description: >
      What one export beyond the allowance costs, already formatted for the
      user (e.g. "¥0.30"). A string because this service knows the currency and
      the app does not. Reported even when overage is switched off, so the app
      can say what a further export would cost.

  FillOverageAllowed:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether exports past the allowance are permitted. Off until something
      actually bills for them: on, with no billing, "charged per export beyond
      a hundred" means GPU time given away at whatever rate a client can ask
      for it. This is the switch to flip when there is a charge to make.

  FillTokenTtlSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: >
      How long a fill token is honoured. The only thing limiting what a leaked
      one is worth — the inpaint service has no revocation list and should not
      grow one. It need not cover a whole export: one is fetched per export,
      and expiry mid-export costs the remaining batches a local fallback.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        LICENSE_SIGNING_SECRET: !Ref LicenseSigningSecret
        PAYMENT_PROVIDER: !Ref PaymentProvider
        STRIPE_API_KEY: !Ref StripeApiKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        LEMON_API_KEY: !Ref LemonApiKey
        SES_SENDER_EMAIL: !Ref SesSenderEmail
        MOCK_MODE: !Ref MockMode
        EXPIRY_DAYS: !Ref ExpiryDays
        TRIAL_DAYS: !Ref TrialDays
        BASE_MONTHLY_PRICE: !Ref BaseMonthlyPrice
        PLAN_CURRENCY: !Ref PlanCurrency
        USD_EXCHANGE_RATE: !Ref UsdExchangeRate
        ORDERS_TABLE: !Ref OrdersTable
        # Ticket 72: the (userId, appId) and (deviceId, appId) tables. The
        # pre-appId originals they replaced are gone from this template as of
        # Ticket 74, along with the read-through that used to reach them.
        LICENSES_TABLE: !Ref LicensesV2Table
        TRIALS_TABLE: !Ref TrialsV2Table
        LICENSES_KEY_INDEX: licenseKey-index
        DEMOS_TABLE: !Ref DemosTable
        DEMO_DAYS: !Ref DemoDays
        DEMO_PLAN_ID: !Ref DemoPlanId
        DEFAULT_APP_ID: !Ref DefaultAppId
        PAYMENT_SUCCESS_URL: !Ref PaymentSuccessUrl
        PAYMENT_CANCEL_URL: !Ref PaymentCancelUrl
        DOUYIN_APP_ID: !Ref DouyinAppId
        DOUYIN_MERCHANT_ID: !Ref DouyinMerchantId
        DOUYIN_APP_SECRET: !Ref DouyinAppSecret
        DOUYIN_NOTIFY_URL: !Ref DouyinNotifyUrl
        FILL_USAGE_TABLE: !Ref FillUsageTable
        FILL_ENDPOINT_URL: !Ref FillEndpointUrl
        FILL_SIGNING_SECRET: !Ref FillSigningSecret
        FILL_FREE_UNITS: !Ref FillFreeUnits
        FILL_OVERAGE_PRICE: !Ref FillOveragePrice
        FILL_OVERAGE_ALLOWED: !Ref FillOverageAllowed
        FILL_TOKEN_TTL_SECONDS: !Ref FillTokenTtlSeconds

Resources:
  # ── Ticket 28: order / license store ────────────────────────────────────────
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST   # scales to zero — no fixed cost, per Ticket 28 §1
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index   # powers /payment-history
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Ticket 33 / 72: free trial and licences, keyed per app ─────────────────
  # The pre-appId LicensesTable and TrialsTable stood here until Ticket 74.
  # They carried DeletionPolicy: Retain, so removing them from this template
  # only stopped CloudFormation managing them — the rows are still in the
  # account and must be deleted by hand once they are certainly not needed.
  # deviceId/userId partitions and appId sorts, not the other way round: with
  # a handful of apps, appId as the partition key would funnel every write on
  # the account into that handful of partitions. This way the load spreads and
  # "everything this device/user holds" stays a single query.
  TrialsV2Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: appId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: appId
          KeyType: RANGE

  LicensesV2Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: appId
          AttributeType: S
        - AttributeName: licenseKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: appId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # The one lookup that does not already know (userId, appId): a licence
        # key arrives on its own at the verify route, and what has to be
        # decided is which app it belongs to. KEYS_ONLY is not enough —
        # _find_license_by_key reads expiresAt off the row it finds.
        - IndexName: licenseKey-index
          KeySchema:
            - AttributeName: licenseKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ── Demo licences, keyed by "<appId>#<deviceId>" ────────────────────────────
  # Separate from TrialsV2Table because a demo is scoped per app as well as per
  # device: a demo spent in one app on a machine is not another app's demo to
  # refuse. See _demo_key() in handler.py.
  DemosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: demoKey
          AttributeType: S
      KeySchema:
        - AttributeName: demoKey
          KeyType: HASH

  # ── Cloud fill usage, one row per (account, month) ──────────────────────────
  # userKey is the userId when there is one and "<appId>#<deviceId>" when there
  # is not, so an allowance belongs to whoever paid rather than to a machine —
  # the same reasoning as DemosTable's key, and the reason "#" is excluded from
  # _APP_ID_RE. The month is the sort key so "what has this account spent, and
  # when" stays a single query.
  #
  # TTL on expiresAt, set a year out by _fill_add: without it this grows a row
  # per account per month forever, and nothing reads a period that old.
  FillUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userKey
          AttributeType: S
        - AttributeName: period
          AttributeType: S
      KeySchema:
        - AttributeName: userKey
          KeyType: HASH
        - AttributeName: period
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  LicenseVerifierRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege execution role for the Ruanjian license verifier
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteLicenseVerifierLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-LicenseVerifier:*
        - PolicyName: SendLicenseKeyEmail
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped by condition, not just action, so the role can only send
              # From the one address configured in SesSenderEmail — no-op (denied)
              # while that parameter is left blank.
              - Effect: Allow
                Action: ses:SendEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SesSenderEmail
        - PolicyName: PaymentOrderStore
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !Sub '${OrdersTable.Arn}/index/*'
                  - !GetAtt LicensesV2Table.Arn
                  - !Sub '${LicensesV2Table.Arn}/index/*'
                  - !GetAtt TrialsV2Table.Arn
                  - !GetAtt DemosTable.Arn
                  # UpdateItem on this one is the ADD that counts an export;
                  # see _fill_add. No Scan or DeleteItem: nothing here reads
                  # the table whole, and a usage row is aged out by TTL rather
                  # than removed by this function.
                  - !GetAtt FillUsageTable.Arn

  LicenseVerifier:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Role: !GetAtt LicenseVerifierRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - Content-Type

Outputs:
  LicenseVerifierFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LicenseVerifier.Arn
  LicenseVerifierRoleArn:
    Description: Least-privilege Lambda execution role ARN
    Value: !GetAtt LicenseVerifierRole.Arn
  LicenseVerifierUrl:
    Description: >-
      Public HTTPS endpoint. POST here directly for license verification;
      POST <this-url>/stripe-webhook for the Stripe webhook listener
      (set as the endpoint URL in the Stripe Dashboard, listening for
      checkout.session.completed). Ticket 28 adds: POST <this-url>/create-order,
      GET <this-url>/order-status, GET <this-url>/payment-history, and
      POST <this-url>/douyin-webhook (set as the Douyin Pay merchant callback URL).
      Ticket 33 adds: POST <this-url>/trial/activate, GET <this-url>/trial/status.
      Ticket 34 adds: GET <this-url>/plans.
    # NOTE: FunctionUrl is an attribute of the auto-generated AWS::Lambda::Url
    # resource (logical id "<FunctionLogicalId>Url", from FunctionUrlConfig
    # below), not of AWS::Serverless::Function/AWS::Lambda::Function itself —
    # !GetAtt LicenseVerifier.FunctionUrl fails stack updates with "Requested
    # attribute FunctionUrl does not exist in schema for AWS::Lambda::Function".
    Value: !GetAtt LicenseVerifierUrl.FunctionUrl
  FillUsageTableName:
    Description: Cloud fill usage, one row per account per month
    Value: !Ref FillUsageTable

  OrdersTableName:
    Value: !Ref OrdersTable
  TrialsV2TableName:
    Value: !Ref TrialsV2Table
  LicensesV2TableName:
    Value: !Ref LicensesV2Table
  DemosTableName:
    Value: !Ref DemosTable

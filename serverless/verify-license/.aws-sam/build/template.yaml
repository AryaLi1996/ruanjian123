AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ruanjian subscription license verification API
Parameters:
  LicenseSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret shared with the Electron app license configuration
  PaymentProvider:
    Type: String
    Default: custom
    AllowedValues:
    - custom
    - stripe
    - lemonsqueezy
    - paddle
  StripeApiKey:
    Type: String
    Default: ''
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: "Stripe webhook signing secret (\"whsec_...\") from Dashboard \u2192\
      \ Developers \u2192 Webhooks. Required to accept POST <FunctionUrl>/stripe-webhook\
      \ (checkout.session.completed \u2192 issues a license key onto the new subscription's\
      \ metadata)."
  LemonApiKey:
    Type: String
    Default: ''
    NoEcho: true
  SesSenderEmail:
    Type: String
    Default: ''
    Description: "Verified SES sender address used to email newly-issued license keys\
      \ after checkout. Leave blank to disable email delivery (the key still lands\
      \ in Stripe metadata either way \u2014 see _handle_checkout_completed in handler.py)."
  MockMode:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
  ExpiryDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 366
  PaymentSuccessUrl:
    Type: String
    Default: https://ruanjian.app/payment/success
    Description: Stripe Checkout success_url base. The app never loads this page (it
      detects success by polling /order-status), but Stripe requires a valid HTTPS
      URL to redirect to after payment.
  PaymentCancelUrl:
    Type: String
    Default: https://ruanjian.app/payment/cancel
  DouyinAppId:
    Type: String
    Default: ''
    Description: Douyin Open Platform app ID. Leave blank to disable Douyin Pay.
  DouyinMerchantId:
    Type: String
    Default: ''
  DouyinAppSecret:
    Type: String
    Default: ''
    NoEcho: true
  DouyinNotifyUrl:
    Type: String
    Default: ''
    Description: Overrides the auto-derived <FunctionUrl>/douyin-webhook callback
      URL.
Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 256
    Architectures:
    - arm64
    Environment:
      Variables:
        LICENSE_SIGNING_SECRET:
          Ref: LicenseSigningSecret
        PAYMENT_PROVIDER:
          Ref: PaymentProvider
        STRIPE_API_KEY:
          Ref: StripeApiKey
        STRIPE_WEBHOOK_SECRET:
          Ref: StripeWebhookSecret
        LEMON_API_KEY:
          Ref: LemonApiKey
        SES_SENDER_EMAIL:
          Ref: SesSenderEmail
        MOCK_MODE:
          Ref: MockMode
        EXPIRY_DAYS:
          Ref: ExpiryDays
        ORDERS_TABLE:
          Ref: OrdersTable
        LICENSES_TABLE:
          Ref: LicensesTable
        TRIALS_TABLE:
          Ref: TrialsTable
        PAYMENT_SUCCESS_URL:
          Ref: PaymentSuccessUrl
        PAYMENT_CANCEL_URL:
          Ref: PaymentCancelUrl
        DOUYIN_APP_ID:
          Ref: DouyinAppId
        DOUYIN_MERCHANT_ID:
          Ref: DouyinMerchantId
        DOUYIN_APP_SECRET:
          Ref: DouyinAppSecret
        DOUYIN_NOTIFY_URL:
          Ref: DouyinNotifyUrl
Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: orderId
        AttributeType: S
      - AttributeName: userId
        AttributeType: S
      - AttributeName: createdAt
        AttributeType: N
      KeySchema:
      - AttributeName: orderId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: userId-createdAt-index
        KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  LicensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
  TrialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: deviceId
        AttributeType: S
      KeySchema:
      - AttributeName: deviceId
        KeyType: HASH
  LicenseVerifierRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege execution role for the Ruanjian license verifier
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: WriteLicenseVerifierLogs
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-LicenseVerifier:*
      - PolicyName: SendLicenseKeyEmail
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: ses:SendEmail
            Resource: '*'
            Condition:
              StringEquals:
                ses:FromAddress:
                  Ref: SesSenderEmail
      - PolicyName: PaymentOrderStore
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            Resource:
            - Fn::GetAtt:
              - OrdersTable
              - Arn
            - Fn::Sub: ${OrdersTable.Arn}/index/*
            - Fn::GetAtt:
              - LicensesTable
              - Arn
            - Fn::GetAtt:
              - TrialsTable
              - Arn
  LicenseVerifier:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LicenseVerifier
      Handler: handler.handler
      Role:
        Fn::GetAtt:
        - LicenseVerifierRole
        - Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
          - '*'
          AllowMethods:
          - GET
          - POST
          AllowHeaders:
          - Content-Type
    Metadata:
      SamResourceId: LicenseVerifier
Outputs:
  LicenseVerifierFunctionArn:
    Description: Lambda function ARN
    Value:
      Fn::GetAtt:
      - LicenseVerifier
      - Arn
  LicenseVerifierRoleArn:
    Description: Least-privilege Lambda execution role ARN
    Value:
      Fn::GetAtt:
      - LicenseVerifierRole
      - Arn
  LicenseVerifierUrl:
    Description: 'Public HTTPS endpoint. POST here directly for license verification;
      POST <this-url>/stripe-webhook for the Stripe webhook listener (set as the endpoint
      URL in the Stripe Dashboard, listening for checkout.session.completed). Ticket
      28 adds: POST <this-url>/create-order, GET <this-url>/order-status, GET <this-url>/payment-history,
      and POST <this-url>/douyin-webhook (set as the Douyin Pay merchant callback
      URL). Ticket 33 adds: POST <this-url>/trial/activate, GET <this-url>/trial/status.'
    Value:
      Fn::GetAtt:
      - LicenseVerifierUrl
      - FunctionUrl
  OrdersTableName:
    Value:
      Ref: OrdersTable
  LicensesTableName:
    Value:
      Ref: LicensesTable
  TrialsTableName:
    Value:
      Ref: TrialsTable
